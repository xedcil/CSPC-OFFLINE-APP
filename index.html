<html lang="en"><head><meta charset="utf-8"><title>GO APP · Social, Cultural &amp; Political Change · Grade 12 Week 8</title>

<meta name="theme-color" content="#14213d"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f5f2ea;--card:#fffdf8;--ink:#14213d;--mut:#586179;--navy:#14213d;--gold:#c8962b;--goldbg:#f8ecc9;--ok:#2b7a4b;--bad:#b3392f;--line:#e2dccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1325;--card:#161f38;--ink:#eef0f6;--mut:#a4aec6;--gold:#e0b04a;--goldbg:#2b2512;--ok:#5cc08a;--bad:#ef7a70;--line:#2a3452}}
:root[data-theme="dark"]{--bg:#0d1325;--card:#161f38;--ink:#eef0f6;--mut:#a4aec6;--gold:#e0b04a;--goldbg:#2b2512;--ok:#5cc08a;--bad:#ef7a70;--line:#2a3452}
*{box-sizing:inherit}html,body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 Calibri,"Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Cambria,Georgia,serif;margin:0;line-height:1.2}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:30px}
header.top{background:#14213d;color:#fff;padding:14px 16px 18px;border-bottom:4px solid var(--gold)}
.brand{display:flex;gap:12px;align-items:center}.brand b{display:block;font:700 15px/1.25 Cambria,Georgia,serif}.brand span{font-size:12px;opacity:.8}
.subj{margin-top:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}.subj h1{font-size:22px;color:#fff}.subj small{display:block;color:#e8c777;font-size:13px}
.tools{display:flex;gap:6px;align-items:center}.badge{border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:4px 10px;font-size:12px;white-space:nowrap}
.ib{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;min-height:36px;min-width:36px;font:inherit;cursor:pointer}
main{padding:16px}
.anchor{background:var(--goldbg);border-left:5px solid var(--gold);border-radius:6px;padding:12px 14px;margin-bottom:16px}.anchor h3{font-size:15px;margin-bottom:4px}.anchor p{margin:0;font-size:14px}
.meta{font-size:13px;color:var(--mut)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--gold)}
.spine{margin:20px 0 0 14px;padding-left:28px;border-left:3px solid var(--line)}.day{position:relative;margin-bottom:14px}
.node{position:absolute;left:-44px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--card);border:3px solid var(--gold);display:grid;place-items:center;font-size:12px;font-weight:700}
.locked .node{border-color:var(--line);color:var(--mut)}.fin .node{background:var(--ok);border-color:var(--ok);color:#fff}
.dcard{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font:inherit;cursor:pointer;min-height:56px}
.dcard[disabled]{opacity:.55;cursor:not-allowed}.dcard h3{font-size:16px}.dcard p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.steps{display:flex;gap:4px;margin:6px 0 14px}.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--gold)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.panel h2{font-size:20px;margin-bottom:8px}.panel p{margin:8px 0}
.chip{display:inline-block;background:var(--goldbg);border-radius:6px;padding:2px 8px;font-size:12px;margin-bottom:8px}
.btn{display:block;width:100%;min-height:50px;border-radius:10px;border:0;background:#14213d;color:#fff;font:700 16px inherit;cursor:pointer;margin-top:12px}
.btn.gold{background:var(--gold);color:#14213d}.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.row{display:flex;gap:8px}.row .btn{margin-top:12px}
.back{background:none;border:0;color:var(--ink);font:inherit;padding:8px 0;min-height:44px;cursor:pointer}
.eq{display:block;text-align:center;font:700 18px/1.4 Cambria,Georgia,serif;background:var(--bg);border:2px solid var(--gold);border-radius:10px;padding:10px;margin:12px 0}
.ws{border-left:4px solid var(--gold);background:var(--bg);padding:6px 12px;margin:8px 0;border-radius:0 8px 8px 0}
.err{border-left:4px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card));padding:6px 12px;margin:8px 0;border-radius:0 8px 8px 0}
.good{border-left:4px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card));padding:6px 12px;margin:8px 0;border-radius:0 8px 8px 0}
.hint{font-size:14px;margin:8px 0;padding:8px 10px;border-radius:8px;background:var(--goldbg)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;font:inherit;color:var(--ink);min-height:48px;cursor:pointer}
.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--bad)}.opt[disabled]{opacity:1}
.pack{font-size:12px;color:var(--mut);margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
.ch{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}.ch span{background:var(--bg);border:2px solid var(--gold);border-radius:8px;padding:4px 8px;font-size:13px}.ch i{font-style:normal;color:var(--gold);font-weight:700}
.vn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.vn div{border:2px solid var(--gold);border-radius:12px;padding:8px;font-size:13px;background:var(--goldbg)}.vn .m{grid-column:1/3;text-align:center;background:var(--bg)}
details.zc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:14px}details.zc summary{cursor:pointer;font-weight:700;min-height:32px}details.zc p{margin:6px 0;font-size:14px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style></head><body><div class="app" id="app"></div>
<script>
/* ===== CONTENT: Grade 12 · Week 8 · Sources of Social, Cultural, and Political Change (from the ILAW DLL) ===== */
var D=[
{t:"Introduction to Social, Cultural, and Political Change",s:"The three spheres of society",o:"I can define social, cultural, and political change and sort local examples into the right sphere.",h:"Observe one change happening in your neighborhood tonight and write a two-sentence reflection in your notebook.",
c:[["Hook: Barangay Then and Now","Picture your barangay <b>ten years ago</b>: the stores, the rides, the way people talked, who led the community. Now look at it today. <b>What changed, and why does it matter to your generation?</b><br>Gallery Walk: name <b>one change</b> in each place:⟦Home>School>Community>Social media⟧Write your four answers in your notebook. We will use them today."],
["What is social change?","No society stays the same. <b>Change</b> is a noticeable difference in patterns of life over time. Society has three spheres:<div class='ws'><b>Social</b>: relationships and institutions (family, school, work, groups)<br><b>Cultural</b>: shared ways of life (language, food, music, beliefs, dress)<br><b>Political</b>: power and governance (laws, leaders, voting, participation)</div>The spheres overlap, so one event can touch all three."],
["Local examples","<b>Example 1: Social.</b> More Davao parents work abroad or on call-center shifts, so grandparents and older siblings take over child care. <i>Family roles changed.</i><br><br><b>Example 2: Cultural.</b> Teens mix Bisaya, English, and Tagalog slang, and K-pop sits beside OPM on their playlists. <i>Language and tastes changed.</i><br><br><b>Example 3: Political.</b> A barangay assembly bans single-use plastic bags in the market. <i>The rules changed.</i>"],
["Spotting the first signs","Early signs of change in a community: <b>new objects</b> (e-trikes, QR payments), <b>new words and habits</b>, <b>new rules</b>, and <b>new groups</b> (online communities). Ask three questions:<div class='ws'>1. What is different from before?<br>2. Who is affected?<br>3. Why now?</div><b>Overlap example:</b> online classes are social (school routines change), cultural (new study habits), and political (DepEd policy). To sort it, ask which change is the <b>main</b> one."],
["Watch out and remember","<div class='err'><b>✗ Common mix-up:</b> “A new smartphone arrived, so culture changed.”</div><div class='good'><b>✓ Better:</b> A phone is technology. It becomes cultural change only when people's language, customs, or habits actually change.</div><b>Finish the sentence in your notebook:</b> <i>Change in society happens when…</i><br>Next: you try."]],
y:{p:"Sort each situation into the sphere that changed MOST.",st:[["A family's parents now work night shifts, so grandparents raise the children.",["Social","Cultural","Political"],0,["Look at roles and relationships inside an institution.","The family is a social institution.","Family roles changed, so it is social."]],["Teens in the barangay mix Bisaya and English and spread new slang and dance trends.",["Social","Cultural","Political"],1,["Slang and dances are shared ways of life.","Think language, music, and customs.","It is cultural."]],["The barangay assembly votes to ban single-use plastic bags.",["Social","Cultural","Political"],2,["Ask who has the power to make rules.","An ordinance is a local law.","Rules and governance changed, so it is political."]]],f:"You can tell the spheres apart: <b>social</b> = relationships, <b>cultural</b> = ways of life, <b>political</b> = power and rules."},
sp:{w:"“Smartphones arrived in our barangay, so that is already cultural change.”",o:["A gadget is technology. It is cultural change only when customs, language, or habits really change.","Smartphones are political change.","Cultural change can never involve technology.","Only laws can cause change."],a:0,x:"Always ask what changed in people's way of life, not only what new thing appeared."},
q:[["Which best defines social change?",["A change in the weather","Changes in patterns of relationships and institutions over time","Only the election of new leaders","The invention of one gadget"],1,"Social change is a shift in how relationships and institutions (family, school, work) are organized."],["Teens mix English into Bisaya and adopt a dance craze. Which sphere changed?",["Cultural","Political","Economic only","None"],0,"Language and entertainment are shared ways of life, so this is cultural change."],["A barangay passes an ordinance on plastic bags. Which sphere?",["Social","Cultural","Political","Religious"],2,"Making and enforcing rules is governance, so it is political change."],["Why can one event, like online classes, touch several spheres?",["Because the spheres overlap","Because only one sphere exists","Because change is random","Because gadgets control society"],0,"Social, cultural, and political life are connected, so one event can affect all three."],["Which is an early sign of change in a community?",["Nothing looks different","New words, habits, objects, or rules appear","Only old buildings remain","People stop talking"],1,"Noticing what is new (objects, words, habits, rules) is how we spot change early."]]},
{t:"Innovation as a Driver of Transformation",s:"How new ideas reshape communities",o:"I can define innovation, explain how it changes community life, and weigh its positive and negative effects.",h:"Ask an older family member about one tool or gadget that completely changed how their household operated when they were teenagers.",
c:[["Hook: The Wrong Statement","Your teacher says: <b>“Smartphones are the only innovation that ever changed human history.”</b> True or false? Challenge it with your group. Think of the <b>jeepney</b>, the <b>plow</b>, and the <b>electric fan</b>. Which one solved more problems for your community, and why?"],
["What is innovation?","<div class='eq'>Innovation = a new idea, method, or device that changes how people live or work</div><div class='ws'><b>Invention</b>: creating something new (the telephone)<br><b>Discovery</b>: finding what already exists (a plant's medicinal use)<br><b>Primary</b> innovation: brand-new (the internet)<br><b>Secondary</b> innovation: an improvement or new use of something existing (the e-jeepney)</div>Innovation can be <b>technological</b> (tools) or <b>social</b> (cooperatives, online enrollment)."],
["Three local innovations","<b>Example 1: The jeepney.</b>⟦Solves: cheap rides>Creates: pollution and traffic⟧Built from surplus US military jeeps after World War II, it gave affordable transport and jobs for drivers.<br><br><b>Example 2: E-wallets (GCash, Maya).</b>⟦Solves: easy payments>Creates: scams, digital divide⟧Sari-sari stores can accept cashless payment, but people without phones or signal are left out.<br><br><b>Example 3: Mechanical rice thresher.</b>⟦Solves: faster harvest>Creates: fewer seasonal jobs⟧"],
["Weighing the effects","<div class='ws'><b>Positive:</b> faster work, wider access, new jobs, easier connection<br><b>Negative:</b> lost jobs, high cost, dependence, pollution, people left out</div>Use three checks on any innovation:⟦Who benefits?>Who is left out?>What new problem appears?⟧<b>Example:</b> online enrollment saves travel time for parents (benefit), but families with no internet need extra help (left out)."],
["Watch out and remember","<div class='err'><b>✗</b> “Innovation always means progress for everyone.”</div><div class='good'><b>✓</b> Each innovation solves some problems and creates others. Judge it by who gains and who loses.</div><div class='err'><b>✗</b> “Innovation means gadgets only.”</div><div class='good'><b>✓</b> Social innovations count too, such as cooperatives and barangay health worker systems.</div><b>Finish the sentence:</b> <i>The most impactful innovation in my daily life is… because…</i><br>Next: you try."]],
y:{p:"Analyze each innovation case.",st:[["Which is an INVENTION (something newly created)?",["Finding that a local plant has medicinal use","Building the first working telephone","Repainting an old jeepney"],1,["Invention means making something that did not exist.","Finding something that already exists is a discovery.","The first telephone was newly created."]],["A sari-sari store starts accepting e-wallet payments. Which is a POSITIVE effect?",["Customers can pay without exact change","People without phones are left out","Scammers target new users"],0,["Look for a benefit, not a problem.","Two options describe problems.","Easier payment is the benefit."]],["In the same case, which is a NEGATIVE effect?",["Faster checkout","Customers without phones or signal may be left out","Less cash to carry"],1,["Ask: who is left out?","Faster checkout and less cash are benefits.","Missing phones or signal is the digital divide."]],["The modern e-jeepney improves an existing vehicle. What type of innovation is it?",["Primary: brand-new","Secondary: an improvement of something existing"],1,["Was the jeepney already there before?","This builds on something that exists.","It is secondary."]]],f:"Strong analysis names the <b>problem solved</b>, the <b>new problem created</b>, and <b>who gains or loses</b>."},
sp:{w:"“Smartphones are the only innovation that ever changed human history.”",o:["Many innovations (the plow, jeepney, printing press) reshaped societies, so no single gadget is the only one.","Smartphones never changed anything.","Only old innovations count.","Innovations never change history."],a:0,x:"Be careful with words like “only” and “always”. History shows many innovations changing society."},
q:[["Which best defines innovation?",["A new idea, method, or device that changes how people live or work","A tradition passed down unchanged","A law passed by the barangay","A group of people moving to a new place"],0,"Innovation is something new (or newly improved) that changes how people live or work."],["Creating something that did not exist before is called…",["Discovery","Invention","Diffusion","Assimilation"],1,"Invention creates something new. Discovery finds what already exists."],["Turning surplus US military jeeps into passenger jeepneys is mainly…",["A primary innovation","A secondary innovation: a new use of something existing","A discovery","Assimilation"],1,"The jeep already existed. Adapting it for public transport is a secondary innovation."],["Which question best checks the full effect of an innovation?",["Is it expensive?","Who benefits, who is left out, and what new problem appears?","Is it popular online?","Is it from abroad?"],1,"A full analysis looks at gains, losses, and side effects."],["A thresher speeds harvest but reduces seasonal jobs. This shows that innovation…",["Has only positive effects","Has only negative effects","Can have both positive and negative effects","Never affects jobs"],2,"One innovation can help some people and hurt others at the same time."]]},
{t:"Diffusion and Cultural Spread",s:"How traits travel between societies",o:"I can define cultural diffusion, trace how a trait spreads, and analyze how global media influences Filipino youth culture.",h:"Identify one foreign food trend in your community and trace where it originally came from.",
c:[["Hook: The Rumor Mill","A global song or dance trend goes viral. Within days, students in our school are doing it. <b>How did it get here so fast?</b><br>Whisper game: a short message passes through five students and comes out changed. Cultural traits also <b>change</b> as they travel.⟦Origin>Channel>Our school>Local version⟧"],
["What is diffusion?","<div class='eq'>Diffusion = the spread of cultural traits (ideas, foods, music, technology) from one society to another</div>Common <b>channels</b>: migration and travel, trade, conquest or colonization, and media (TV, internet, social media). Traits can meet <b>barriers</b> too, such as cost, language, beliefs, and lack of internet."],
["Three types, three examples","<div class='ws'><b>Direct diffusion</b>: through close contact such as trade, migration, or marriage.<br><i>Example:</i> Chinese traders and settlers brought dishes like pancit and siopao, and the word lumpia, into Filipino food.</div><div class='ws'><b>Forced diffusion</b>: through conquest, colonization, or pressure.<br><i>Example:</i> Spanish rule spread Catholicism and Spanish surnames. American rule made English the language of schools.</div><div class='ws'><b>Stimulus diffusion</b>: the idea spreads, but locals create their own version.<br><i>Example:</i> P-pop groups such as SB19 adopted the idol-group style but sing about Filipino life in Filipino and English.</div>"],
["Global media and Filipino youth","⟦K-pop dance (Korea)>YouTube and TikTok>Davao students>School contest with Bisaya lyrics⟧<div class='ws'><b>Positive:</b> new skills, creativity, careers for content creators, global friendships<br><b>Negative:</b> pressure to copy, narrow beauty standards, less interest in local arts</div>Social media is the <b>fastest channel</b> today and often triggers stimulus diffusion."],
["Watch out and remember","<div class='err'><b>✗</b> “Diffusion means foreign culture replaces ours.”</div><div class='good'><b>✓</b> Diffusion is spreading. People adopt, adapt, or reject traits, and often add a local twist.</div><div class='err'><b>✗</b> “Traits only flow into the Philippines.”</div><div class='good'><b>✓</b> It goes both ways. Adobo and halo-halo now appear in restaurants abroad.</div><b>Finish the sentence:</b> <i>Cultural diffusion changes local traditions by…</i><br>Next: you try."]],
y:{p:"Identify the type of diffusion.",st:[["Chinese traders settle in port towns, and Filipinos begin eating pancit and siopao.",["Direct","Forced","Stimulus"],0,["Think of close, voluntary contact.","Traders and settlers lived among Filipinos.","Direct diffusion."]],["Under colonial rule, English became the language of instruction in schools.",["Direct","Forced","Stimulus"],1,["Who decided: the learners or the rulers?","The trait was imposed by those in power.","Forced diffusion."]],["Filipino groups form their own idol group with Filipino lyrics after seeing the K-pop system.",["Direct","Forced","Stimulus"],2,["The idea spread, but not the exact copy.","Locals made their own version.","Stimulus diffusion."]],["Which channel spreads trends to local youth the fastest today?",["Ship trade","Social media","Spoken stories only"],1,["Think of how a dance reaches school in days.","It needs no travel at all.","Social media."]]],f:"To classify diffusion, ask: <b>Was it close contact? Was it imposed? Did locals create their own version?</b>"},
sp:{w:"“Diffusion means our culture is replaced by foreign culture.”",o:["Diffusion is spreading. People adopt, adapt, or reject traits and often make local versions.","Diffusion only happens by force.","Diffusion stops at national borders.","Diffusion never involves media."],a:0,x:"Spreading is not the same as replacing. Local people actively choose and adapt."},
q:[["Cultural diffusion is…",["The spread of cultural traits from one society to another","The loss of a minority culture","A new law","The invention of a tool"],0,"Diffusion is about traits traveling between societies."],["A viral Korean dance becomes a school contest with Bisaya lyrics. This is mostly…",["Forced diffusion","Stimulus diffusion","No diffusion","A discovery"],1,"The idea spread, and locals made their own version: stimulus diffusion."],["Colonial rulers spreading a language or religion is…",["Direct diffusion","Forced diffusion","Stimulus diffusion","Innovation"],1,"When a trait is imposed by those in power, it is forced diffusion."],["Which is a barrier to diffusion?",["Fast internet","Lack of internet access or conflicting beliefs","Friendly neighbors","Shared language"],1,"Cost, language, beliefs, and access can slow or stop a trait from spreading."],["A responsible response to global media influence is to…",["Reject everything foreign","Copy everything without thinking","Enjoy and adapt trends while valuing and promoting local culture","Ignore media completely"],2,"Balanced, critical use keeps the benefits and protects local identity."]]},
{t:"Acculturation and Assimilation",s:"Cultural blending and minority integration",o:"I can tell acculturation from assimilation and evaluate cultural-adaptation scenarios in diverse communities.",h:"Interview a migrant or visitor in your neighborhood about how they adapted to local customs.",
c:[["Hook: A Diary Entry","<i>Dear diary, it is my first month in Davao City. At home, Mama still cooks our hometown dishes and we speak our mother tongue. At school I speak Bisaya and English, and some classmates tease my accent…</i><br><b>How is the student's culture changing? How is the host culture changing?</b> Today we look at what happens when cultures stay in <b>continuous contact</b>."],
["Two kinds of cultural blending","<div class='vn'><div><b>Acculturation</b><br>Adopts new traits while keeping its own identity. Change can go both ways.</div><div><b>Assimilation</b><br>Is absorbed into the dominant culture. The original identity fades.</div><div class='m'>Both begin with long, direct contact between groups (not just a brief exchange).</div></div><div class='ws'><b>Quick test:</b> Is the original identity kept? <b>Yes → acculturation.</b> Fading into the majority? <b>Yes → assimilation.</b></div>"],
["Three scenarios","<b>Example 1: Acculturation.</b> A Mandaya student wears traditional attire at Kadayawan, speaks her mother tongue at home, and uses Bisaya, English, and a smartphone at school.<br><br><b>Example 2: Acculturation.</b> A Hiligaynon family in Davao keeps cooking batchoy and speaking Hiligaynon at home, while using Bisaya at work and joining barangay fiestas.<br><br><b>Example 3: Assimilation.</b> Children of a migrant family stop speaking the mother tongue and drop all home-province traditions. Within a generation the original identity is hard to see."],
["Social impacts and integration","<div class='ws'><b>Positive blending:</b> fusion foods, shared festivals, more languages spoken, stronger friendships across groups<br><b>Risks:</b> language loss, teasing and discrimination, identity stress, fading traditions</div>Healthy <b>integration</b> is not erasure. Communities respect minority cultures and include everyone. The Indigenous Peoples' Rights Act (RA 8371) protects the rights of indigenous peoples to their culture and identity."],
["Watch out and remember","<div class='err'><b>✗</b> “Assimilation is better because everyone becomes the same.”</div><div class='good'><b>✓</b> Assimilation can erase heritage. Diversity thrives when people have respect and choice.</div><div class='err'><b>✗</b> “In acculturation only the minority changes.”</div><div class='good'><b>✓</b> Both groups can change, such as newcomers learning Bisaya while neighbors learn new dishes.</div><b>Finish the sentence:</b> <i>Acculturation is different from assimilation because…</i><br>Next: you try."]],
y:{p:"Classify each scenario.",st:[["A student wears traditional attire at a city festival and speaks her mother tongue at home, yet uses Bisaya and English at school.",["Acculturation","Assimilation"],0,["Is her original identity kept?","She keeps language and attire, and adds new ones.","Acculturation."]],["Children of migrants stop speaking their mother tongue and drop all home-province traditions.",["Acculturation","Assimilation"],1,["Is the original identity fading?","Language and traditions are being dropped.","Assimilation."]],["A family keeps cooking its home dishes and speaking its language at home, and joins local fiestas.",["Acculturation","Assimilation"],0,["Look for both keeping and adopting.","They keep home customs and join local ones.","Acculturation."]],["A newcomer changes her accent, name, and food habits and says she is no longer part of her hometown culture.",["Acculturation","Assimilation"],1,["Is the old identity still there?","She says she no longer belongs to it.","Assimilation."]]],f:"Remember the quick test: <b>identity kept → acculturation</b>, <b>identity fading into the majority → assimilation</b>."},
sp:{w:"“Acculturation and assimilation are the same: both mean adopting another culture.”",o:["In acculturation people keep their identity while adopting traits. In assimilation the original identity fades into the dominant culture.","Acculturation is forced, assimilation is free.","Assimilation always keeps both cultures.","There is no difference."],a:0,x:"Both involve contact, but they differ in whether the original identity is kept."},
q:[["Which scenario shows acculturation?",["A student keeps her dialect at home and adopts city slang at school","A family drops its language, name, and customs entirely","A tourist visits for one day","A song goes viral"],0,"She keeps her identity while adding new traits."],["Which scenario shows assimilation?",["A farmer joins a cooperative","A minority group gradually loses its language and merges into the majority","Two cultures swap recipes and keep both","A school adds a festival"],1,"The original identity fades into the dominant culture."],["A positive social impact of cultural blending is…",["Language loss","Fusion foods, shared festivals, and wider friendships","Teasing","Fading traditions"],1,"Blending can enrich daily life when people stay respectful."],["A risk of one-sided assimilation is…",["Loss of language and heritage","More festivals","Better food","Faster internet"],0,"When one culture is pressured to disappear, its language and heritage can be lost."],["A responsible way to support minority integration is to…",["Make everyone drop their customs","Respect their culture and include them without forcing them to give up their identity","Avoid them","Ask them to leave"],1,"Real integration means inclusion plus respect."]]},
{t:"Social Contradictions, Tensions, and Synthesis",s:"Tension that drives change",o:"I can analyze how contradictions spark change, synthesize the four sources, and propose responsible community responses.",h:"Draft a short advocacy slogan encouraging peaceful and responsible adaptation to community changes.",
c:[["Hook: Dilemma Debate","<b>Can conflict and tension ever be good for society?</b> Give your quick hot take.<br>Now imagine a barangay must choose: turn a rice field into a commercial lot, or protect it for farmers. Which side of the room would you stand on, and why?"],
["What are social contradictions?","<div class='eq'>Social contradiction = a clash between groups, values, or interests within a society</div><div class='ws'><b>Inequality:</b> unequal access to wealth, rights, or services<br><b>Clashing values:</b> tradition versus change<br><b>Resource scarcity:</b> not enough land, water, or jobs</div>How tension becomes change:⟦Contradiction>Tension>Pressure>Reform or change⟧"],
["Three examples","<b>Example 1: Inequality → political change.</b> Filipino women pressed for the right to vote, and women's suffrage was approved in the 1937 plebiscite.<br><br><b>Example 2: Clashing values and livelihoods.</b> In jeepney modernization, drivers worry about costs and income, while commuters want safer, cleaner transport. Both sides raise valid points. Dialogue and policy adjustments are how tension becomes reform.<br><br><b>Example 3: Scarce resources.</b> Imagine a barangay with limited water. Conflict leads residents to form a water association with a fair rotation schedule."],
["Synthesis: the four sources together","Take <b>smartphones and social media</b>:⟦Innovation: new tools>Diffusion: trends and news spread>Acculturation: youth blend local and global culture>Tension: fake news, privacy, unequal access>Change: new online rules, habits, and participation⟧Each source feeds the next, and tension pushes society toward <b>social, cultural, and political change</b>."],
["Responsible responses and remember","<div class='ws'><b>Responsible response:</b> listen to all sides, check facts, join a barangay consultation, propose win-win solutions, volunteer, and follow the law. No violence or hate.</div><div class='err'><b>✗</b> “Conflict is always bad.”</div><div class='good'><b>✓</b> Tension can reveal real problems. Handled peacefully, it can lead to fair reform.</div><b>Finish the sentence:</b> <i>Societies transform when…</i><br>Next: you try."]],
y:{p:"Analyze tensions and responses.",st:[["Which is a source of social contradiction?",["Unequal access to clean water","A sunny day","A new song"],0,["Look for a clash of interests or unfairness.","Weather and songs do not create a clash by themselves.","Inequality in services is a contradiction."]],["Jeepney drivers and modernization planners disagree. Which response is most responsible?",["Block the road and threaten officials","Join a public consultation and propose options","Ignore the issue"],1,["A responsible response is peaceful and informed.","Threats cause harm.","Consultation and proposals."]],["In “smartphone → trends spread worldwide → youth blend cultures”, which source is “trends spread worldwide”?",["Innovation","Diffusion","Assimilation"],1,["It is about traits traveling.","Innovation is the new tool itself.","Diffusion."]],["Which statement best synthesizes the sources of change?",["Only laws change society","New ideas spread, cultures meet and adapt, tensions arise, and societies reform","Change never happens","Only technology matters"],1,["Look for the answer that links all four sources.","One-factor answers are too narrow.","The second option connects them all."]]],f:"A complete analysis links <b>innovation → diffusion → acculturation or assimilation → tension → change</b>, and ends with a <b>responsible response</b>."},
sp:{w:"“Conflict is always harmful, so a healthy society should have none.”",o:["Tension can expose real problems. Handled peacefully, it can push society toward fair reform.","Conflict is always good.","Violence is the best response to tension.","Societies never change through tension."],a:0,x:"Conflict itself is a signal. The response (peaceful or harmful) decides the outcome."},
q:[["Which are common sources of social contradiction?",["Inequality, clashing values, and scarce resources","Weather, music, and food","Only laws","Only technology"],0,"These three produce the clashes that pressure society to change."],["Women gaining the right to vote (1937) shows that…",["Inequality can pressure society into political reform","Tension never matters","Only men decide change","Culture never changes"],0,"Sustained pressure against inequality produced political change."],["In “Innovation → Diffusion → Contact → Tension → Change”, a trend going viral across countries is…",["Innovation","Diffusion","Tension","Change"],1,"A trait spreading between societies is diffusion."],["Best community response to a land-use conflict?",["Hold a consultation, hear all sides, and propose a fair compromise","Settle it by force","Ignore it","Spread rumors"],0,"Peaceful, inclusive dialogue turns tension into constructive change."],["Which commitment shows a responsible response to change?",["I will verify information, respect differences, and join peaceful community action","I will resist all change","I will follow every trend","I will avoid my community"],0,"Responsible citizens are informed, respectful, and constructive."]]}
];
var T=[["Social change","Changes in relationships and institutions (family, school, work) over time."],["Cultural change","Changes in shared ways of life: language, food, music, beliefs, dress."],["Political change","Changes in power, laws, leaders, and participation."],["Innovation","A new idea, method, or device that changes how people live or work."],["Diffusion","The spread of cultural traits from one society to another (direct, forced, stimulus)."],["Acculturation","Adopting new traits while keeping one's own identity."],["Assimilation","Being absorbed into the dominant culture; the original identity fades."],["Social contradiction","A clash of groups, values, or interests (inequality, clashing values, scarce resources)."]];
